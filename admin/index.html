<meta name="description" content="Explore Bangladesh administration area.">
<script>(function(){try{var t=JSON.parse(localStorage.getItem('eb_theme'));if(!t){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.dataset.theme=t;document.documentElement.setAttribute('data-bs-theme',t)}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

<body class="admin-body" data-page="admin-login" data-nav="solid" data-base="../">
<main class="login-wrap" id="main"><div class="login-card">
  <a class="brand" href="../index.html" aria-label="Back to Explore Bangladesh"><span id="login-logo"></span><span class="brand__text"><strong>Explore Bangladesh</strong><small>Admin</small></span></a>
  <h1>Admin sign in</h1>
  <form id="step-email" novalidate>
    <label class="sr-only" for="login-email">Email</label>
    <input id="login-email" class="form-control form-control-lg" type="email" placeholder="Email" autocomplete="username" required>
    <button type="submit" class="eb-btn eb-btn--primary w-100 mt-3">Send Verification Code</button>
  </form>
  <form id="step-code" hidden novalidate>
    <div id="code-box" hidden><span>Your verification code</span><strong></strong></div>
    <label class="sr-only" for="login-code">Verification code</label>
    <input id="login-code" class="form-control form-control-lg" placeholder="6-digit code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" required>
    <button type="submit" class="eb-btn eb-btn--primary w-100 mt-3">Verify &amp; Sign In</button>
    <button type="button" class="eb-btn eb-btn--ghost w-100 mt-2" id="login-back">Use a different email</button>
  </form>
  <p class="login-msg" id="login-msg" role="status" aria-live="polite"></p>
  <div class="login-links"><a href="../index.html">Back to website</a></div>
</div></main>
<script>document.addEventListener('DOMContentLoaded',function(){document.getElementById('login-logo').innerHTML=EB.Layout.logo(40)})</script>

<script src="../js/admin.js"></script>
</body>
</html>
