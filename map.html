<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Bangladesh Tourist Map – Explore Bangladesh</title>
<meta name="description" content="Explore Bangladesh on an interactive map. Filter by division, district or category and open any tourist spot.">
<meta property="og:site_name" content="Explore Bangladesh">
<meta property="og:type" content="website">
<meta property="og:title" content="Interactive Bangladesh Tourist Map – Explore Bangladesh">
<meta property="og:description" content="Explore Bangladesh on an interactive map. Filter by division, district or category and open any tourist spot.">
<meta name="theme-color" content="#04382C">
<script>(function(){try{var t=JSON.parse(localStorage.getItem('eb_theme'));if(!t){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.dataset.theme=t;document.documentElement.setAttribute('data-bs-theme',t)}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="map" data-nav="solid" data-base="">
<div id="app-header"></div>
<main id="main">
<section class="page-hero container" aria-labelledby="page-title">
  <div class="page-hero__frame"><div data-hero-media></div>
    <div class="page-hero__content"><h1 id="page-title">Explore Bangladesh Map</h1><p>Every tourist spot on one map. Pick one to see its exact location.</p></div></div>
</section>
<section class="section container" aria-label="Map">
  <form class="filter-bar" onsubmit="return false"><div class="row g-3">
    <div class="col-md-4"><label class="form-label" for="m-division">Division</label><select id="m-division" class="form-select" data-ph="All divisions"></select></div>
    <div class="col-md-4"><label class="form-label" for="m-district">District</label><select id="m-district" class="form-select" data-ph="All districts"></select></div>
    <div class="col-md-4"><label class="form-label" for="m-category">Category</label><select id="m-category" class="form-select"></select></div></div></form>
  <div class="map-layout">
    <aside class="map-side" aria-label="Tourist spots on the map"><strong id="m-count" aria-live="polite"></strong><ul class="map-list" id="m-list"></ul></aside>
    <div class="map-frame"><div id="big-map" class="map-box map-box--tall" aria-label="Interactive map of Bangladesh tourist spots"></div></div>
  </div>
</section>
<section class="section section--tint" id="sel-panel" hidden aria-labelledby="sel-title"><div class="container">
  <div class="section-head section-head--row"><div><h2 id="sel-title">Selected tourist spot</h2><p class="muted">Its exact location in Google Maps.</p></div>
  <button type="button" class="eb-btn eb-btn--ghost" id="sel-back">Back to the map</button></div>
  <div class="row g-4"><div class="col-lg-8"><div class="map-frame map-embed"><iframe id="sel-frame" title="Google Map of the selected tourist spot" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div></div>
  <div class="col-lg-4"><div class="info-card" id="sel-info"></div></div></div>
</div></section>
</main>
<div id="app-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="js/data.js"></script>
<script src="js/util.js"></script>
<script src="js/art.js"></script>
<script src="js/storage.js"></script>
<script src="js/favorites.js"></script>
<script src="js/search.js"></script>
<script src="js/map.js"></script>
<script src="js/tourist-spots.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
